name: Testes de pedidos, documentos, estoque e autenticacao
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: senha-efemera-apenas-no-ci
          POSTGRES_DB: test_marcia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d test_marcia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_USER: user
      POSTGRES_PASSWORD: senha-efemera-apenas-no-ci
      POSTGRES_DB: test_marcia_ci
      FLASK_SECRET_KEY: chave-efemera-apenas-no-ci-nao-usar-producao
      COOKIE_SECURE: "false"
      TEST_POSTGRES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r backend/requirements.txt
      - name: Sintaxe do frontend
        run: node --check frontend/script.js
      - name: Pytest unitario e PostgreSQL real isolado
        run: python -m pytest backend/tests -q
      - name: Validar ambiente reproduzível de testes
        run: docker compose -f compose.tests.yaml config --quiet
      - name: Validar configuração Docker Compose da Oracle
        env:
          PUBLIC_DOMAIN: exemplo.invalid
        run: docker compose -f compose.oracle.yaml config --quiet
      - name: Verificar dependência Gunicorn
        run: python -c "import gunicorn; print(gunicorn.__version__)"

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de testes
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Orçamento, confirmação e cancelamento na interface
        run: node frontend/tests/orcamentos-ui.cjs
      - name: Capturas de tela de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-orcamentos
          path: work/ui-screenshots
          if-no-files-found: ignore
