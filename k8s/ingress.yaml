apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: msalgados-ingress

spec:

  ingressClassName: nginx

  tls:
    - hosts:
        - msalgados.local
      secretName: msalgados-tls
  rules:

    - host: msalgados.local

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: frontend-service
                port:
                  number: 80